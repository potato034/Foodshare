<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳分享食物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-3 flex items-center">
        <a href="../index.html" class="text-gray-500 hover:text-giver transition mr-4 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            返回
        </a>
        <div>
            <p class="text-xs text-gray-400">目前登入者</p>
            <span id="page-title" class="text-xl font-bold text-giver">上傳食物</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto py-8 px-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="mb-6 rounded-xl border border-gray-100 bg-orange-50/50 p-4 text-sm text-gray-600">
                送出後會直接加入目前使用者的分享清單，並同步到首頁與個人檔案。
            </div>

            <form id="upload-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">上傳食物相片</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-giver hover:bg-orange-50 transition cursor-pointer" onclick="document.getElementById('file-upload').click()">
                        <div class="space-y-1 text-center">
                            <img id="image-preview" class="mx-auto h-32 object-cover hidden rounded-lg mb-4" />
                            <svg id="upload-icon" class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-giver hover:text-orange-500 focus-within:outline-none">
                                    <span>點擊上傳檔案</span>
                                    <input id="file-upload" name="image" type="file" class="sr-only" accept="image/*" onchange="previewImage(event)">
                                </label>
                                <p class="pl-1">或將圖片拖曳至此</p>
                            </div>
                            <p class="text-xs text-gray-500">支援 PNG, JPG, GIF (最大 5MB)</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="food-name" class="block text-sm font-medium text-gray-700 mb-1">食物名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="food-name" name="title" required placeholder="例如：多出的排骨便當" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">類別 <span class="text-red-500">*</span></label>
                        <select id="category" name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                            <option value="" disabled selected>請選擇類別</option>
                            <option value="便當">🍱 便當</option>
                            <option value="飲料">🧋 飲料</option>
                            <option value="餐盒">🥡 餐盒</option>
                            <option value="甜點">🍰 甜點</option>
                            <option value="其他">🥪 其他</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">供應數量/份量 <span class="text-red-500">*</span></label>
                        <input type="text" id="quantity" name="quantity" required placeholder="例如：3個、大約半鍋" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <div>
                        <label for="time-limit" class="block text-sm font-medium text-gray-700 mb-1">限時領取 <span class="text-red-500">*</span></label>
                        <select id="time-limit" name="time_limit" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                            <option value="1">1 小時內</option>
                            <option value="2">2 小時內</option>
                            <option value="3">3 小時內</option>
                            <option value="6">6 小時內</option>
                            <option value="12">12 小時內</option>
                            <option value="24">24 小時內 (今天內)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">領取地點 <span class="text-red-500">*</span></label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select name="main_location" required class="w-full sm:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                            <option value="" disabled selected>選擇校園地標</option>
                            <option value="圓廳">圓廳</option>
                            <option value="圖書館">圖書館</option>
                            <option value="綜合大樓">綜合大樓</option>
                            <option value="校門口">校門口</option>
                            <option value="社館大樓">社館大樓</option>
                            <option value="應經一館">應經一館</option>
                            <option value="國農大樓">國農大樓</option>
                            <option value="體育館">體育館</option>
                            <option value="理學院">理學院</option>
                            <option value="小禮堂">小禮堂</option>
                            <option value="雲平樓">雲平樓</option>
                        </select>
                        <input type="text" name="detail_location" placeholder="詳細位置 (例：4樓系辦外桌上)" class="w-full sm:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <p class="text-xs text-gray-500 mt-1">選擇鄰近的地標能幫助索取者在地圖上更快找到喔！</p>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">詳細內容 (選填)</label>
                    <textarea id="description" name="description" rows="4" placeholder="補充說明食物的狀態，例如：全新未拆封、微糖微冰、請自備環保容器..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition resize-none"></textarea>
                </div>

                <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
                    <a href="./share.html" class="px-4 py-2 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 transition">查看分享清單</a>
                    <button type="submit" class="bg-giver hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition duration-200 transform hover:-translate-y-0.5">確認發布分享</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const icon = document.getElementById('upload-icon');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    icon.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }
    </script>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile, addShareItem, saveUserProfile, getProfileKey } from './user-store.js';

        const titleEl = document.getElementById('page-title');
        const form = document.getElementById('upload-form');

        function refreshPageState() {
            const snapshot = getCurrentUserSnapshot();
            if (snapshot?.uid) {
                const profile = loadUserProfile(snapshot.uid, snapshot);
                if (titleEl) titleEl.textContent = `${profile.displayName || snapshot.email?.split('@')[0] || '我的'} 的上傳頁`;
                return snapshot;
            }
            if (titleEl) titleEl.textContent = '請先登入後再上傳';
            return null;
        }

        refreshPageState();

        if (form) {
            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const snapshot = getCurrentUserSnapshot();
                if (!snapshot?.uid) {
                    alert('請先登入，才能把資料加入你的個人清單。');
                    return;
                }

                const title = document.getElementById('food-name').value.trim();
                const category = document.getElementById('category').value;
                const quantity = document.getElementById('quantity').value.trim();
                const timeLimit = document.getElementById('time-limit').value;
                const mainLocation = form.elements['main_location'].value;
                const detailLocation = form.elements['detail_location'].value.trim();
                const description = document.getElementById('description').value.trim();
                const preview = document.getElementById('image-preview');

                if (!title || !category || !quantity || !timeLimit || !mainLocation) {
                    alert('請先填完必填欄位');
                    return;
                }

                const nextProfile = addShareItem(snapshot.uid, {
                    title,
                    emoji: category === '便當' ? '🍱' : category === '飲料' ? '🧋' : category === '甜點' ? '🍰' : category === '餐盒' ? '🥡' : '🥪',
                    location: detailLocation ? `${mainLocation}｜${detailLocation}` : mainLocation,
                    timeLabel: `限時 ${timeLimit} 小時`,
                    status: '進行中',
                    quantity,
                    category,
                    description,
                    image: preview && preview.src ? preview.src : '',
                    href: './share.html'
                }, snapshot);

                saveUserProfile(snapshot.uid, nextProfile);
                localStorage.setItem('fs_currentUser', JSON.stringify(snapshot));
                alert('已加入你的分享清單');
                window.location.href = './share.html';
            });
        }

        window.addEventListener('focus', refreshPageState);
    </script>
</body>
</html>
