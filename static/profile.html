<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人檔案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <button onclick="history.back()" class="text-gray-500 hover:text-giver transition flex items-center text-sm font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            返回
        </button>
        <span class="text-lg font-bold text-gray-900">個人檔案</span>
        <button class="text-gray-400 hover:text-gray-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
        </button>
    </header>

    <main class="max-w-5xl mx-auto py-8 px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col items-center text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-16 bg-gradient-to-r from-orange-100 to-teal-100"></div>
                
                <div class="w-24 h-24 rounded-full bg-white border-4 border-white shadow-md flex items-center justify-center text-3xl font-bold text-gray-700 relative z-10 mt-4 mb-3">
                    😗
                </div>
                
                <h1 class="text-2xl font-bold text-gray-900 mb-1">9ana</h1>
                <p class="text-sm text-gray-500 mb-4">應用經濟學系 三年級</p>
                
                <div class="bg-gray-50 rounded-xl p-3 w-full border border-gray-100 mb-4">
                    <p class="text-xs text-gray-500 mb-1">信用評價</p>
                    <div class="flex justify-center items-center space-x-1 text-yellow-400">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <span class="text-gray-700 font-bold ml-1 text-sm">4.8</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 mb-1">累積分享</p>
                        <p class="text-2xl font-extrabold text-giver">14 <span class="text-xs font-normal text-gray-400">次</span></p>
                    </div>
                    <div class="w-10 h-10 bg-orange-50 rounded-full flex items-center justify-center text-xl">🎁</div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-gray-500 mb-1">成功救援</p>
                        <p class="text-2xl font-extrabold text-receiver">28 <span class="text-xs font-normal text-gray-400">次</span></p>
                    </div>
                    <div class="w-10 h-10 bg-teal-50 rounded-full flex items-center justify-center text-xl">🍱</div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-teal-50/50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center">
                        <span class="w-3 h-6 bg-receiver rounded-full mr-2 inline-block"></span>
                        未取食物 (待前往領取)
                    </h2>
                    <span class="bg-receiver text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">1 筆待辦</span>
                </div>
                
                <div class="p-4 space-y-3">
                    <div class="flex items-center justify-between p-3 bg-white border border-gray-100 hover:border-receiver/50 rounded-xl hover:shadow-sm transition group">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-teal-50 rounded-lg flex items-center justify-center text-2xl shrink-0">🥪</div>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm mb-0.5 group-hover:text-teal-700 transition">多買的洪瑞珍三明治</h3>
                                <p class="text-xs text-gray-500">📍 綜合大樓一樓 ｜ ⏰ 期限：今天 18:00 前</p>
                            </div>
                        </div>
                        <a href="/static/detail.html?id=4" class="px-4 py-2 text-xs font-medium text-teal-600 bg-teal-50 hover:bg-receiver hover:text-white rounded-lg transition">
                            查看詳情
                        </a>
                    </div>
                    
                    </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-orange-50/50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-900 flex items-center">
                        <span class="w-3 h-6 bg-giver rounded-full mr-2 inline-block"></span>
                        尚未送完的食物 (分享中)
                    </h2>
                    <span class="bg-giver text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">2 筆進行中</span>
                </div>
                
                <div class="p-4 space-y-3">
                    <div class="flex items-center justify-between p-3 bg-white border border-gray-100 hover:border-giver/50 rounded-xl hover:shadow-sm transition group">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-orange-50 rounded-lg flex items-center justify-center text-2xl shrink-0">🧋</div>
                            <div>
                                <div class="flex items-center space-x-2 mb-0.5">
                                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition">多出的黑糖珍珠鮮奶</h3>
                                    <span class="px-1.5 py-0.5 bg-orange-100 text-orange-600 text-[10px] rounded font-semibold">剩 1 杯</span>
                                </div>
                                <p class="text-xs text-gray-500">📍 男生宿舍大廳 ｜ 🕒 已發布 1 小時</p>
                            </div>
                        </div>
                        <a href="/static/detail.html?id=1" class="px-4 py-2 text-xs font-medium text-orange-600 bg-orange-50 hover:bg-giver hover:text-white rounded-lg transition">
                            管理狀態
                        </a>
                    </div>

                    <div class="flex items-center justify-between p-3 bg-white border border-gray-100 hover:border-giver/50 rounded-xl hover:shadow-sm transition group">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-teal-50 rounded-lg flex items-center justify-center text-2xl shrink-0">🍱</div>
                            <div>
                                <div class="flex items-center space-x-2 mb-0.5">
                                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition">會議多餘的排骨便當</h3>
                                    <span class="px-1.5 py-0.5 bg-orange-100 text-orange-600 text-[10px] rounded font-semibold">剩 2 個</span>
                                </div>
                                <p class="text-xs text-gray-500">📍 社管大樓 4 樓 ｜ 🕒 已發布 3 小時</p>
                            </div>
                        </div>
                        <a href="/static/detail.html?id=2" class="px-4 py-2 text-xs font-medium text-orange-600 bg-orange-50 hover:bg-giver hover:text-white rounded-lg transition">
                            管理狀態
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
