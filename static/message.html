<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私訊 — FoodShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { receiver: '#0d9488', giver: '#f97316' } } }
        };
    </script>
    <style>
        body { height: 100dvh; }
        #chat-messages { scroll-behavior: smooth; }
        .bubble-me    { background: #0d9488; color: #fff; border-radius: 18px 18px 4px 18px; }
        .bubble-other { background: #f1f5f9;              border-radius: 18px 18px 18px 4px; }
    </style>
</head>
<body class="bg-gray-50 font-sans flex flex-col pt-16">
    <script src="./header.js"></script>

    <div class="flex flex-1 overflow-hidden" style="height: calc(100dvh - 64px)">

        <!-- ── 左側：對話列表 ─────────────────────────── -->
        <aside id="sidebar"
               class="w-48 sm:w-64 md:w-80 shrink-0 bg-white border-r border-gray-100 flex flex-col transition-all duration-300">
            <div class="px-4 pt-5 pb-3 border-b border-gray-100">
                <h1 class="text-lg font-extrabold text-gray-900">私訊</h1>
            </div>
            <div id="conv-list" class="flex-1 overflow-y-auto divide-y divide-gray-50">
                <p class="text-center text-gray-400 text-sm py-10">載入中…</p>
            </div>
        </aside>

        <!-- ── 右側：聊天區 ──────────────────────────── -->
        <main id="chat-panel"
               class="flex flex-col flex-1 overflow-hidden bg-gray-50">

            <!-- 未選取時的提示 -->
            <div id="chat-empty" class="flex-1 flex items-center justify-center text-gray-400 text-sm">
                選擇左側對話開始聊天
            </div>

            <!-- 聊天主體（選取對話後顯示） -->
            <div id="chat-body" class="hidden flex-col flex-1 overflow-hidden">

                <!-- 頂部：對方名稱 + 訂單資訊卡 -->
                <div class="bg-white border-b border-gray-100 px-5 py-3 shrink-0">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button id="back-btn" class="text-gray-400 hover:text-gray-600 text-xl hidden">←</button>
                            <div id="chat-avatar" class="w-9 h-9 rounded-full bg-receiver text-white font-bold flex items-center justify-center text-sm shrink-0"></div>
                            <span id="chat-name" class="font-bold text-gray-900"></span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button id="toggle-order-btn" class="text-xs text-receiver hover:underline hidden">查看訂單資訊 ▾</button>
                            <button id="fullscreen-btn" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shrink-0">
                                <svg id="fullscreen-svg" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4" />
                                </svg>
                                <span id="fullscreen-btn-text">全螢幕</span>
                            </button>
                        </div>
                    </div>

                    <!-- 訂單資訊卡（可收合） -->
                    <div id="order-card" class="hidden mt-3 bg-teal-50 border border-teal-100 rounded-xl p-3 flex items-start gap-3">
                        <div id="order-hero" class="w-14 h-14 rounded-xl bg-white flex items-center justify-center text-2xl shrink-0 overflow-hidden"></div>
                        <div class="flex-1 min-w-0 text-xs text-gray-700 space-y-0.5">
                            <p id="order-title" class="font-bold text-sm text-gray-900 truncate"></p>
                            <p id="order-location"></p>
                            <p id="order-status"></p>
                            <div id="order-rsv" class="hidden pt-1 border-t border-teal-100 mt-1 space-y-0.5">
                                <p id="order-rsv-name"></p>
                                <p id="order-rsv-sid"></p>
                                <p id="order-rsv-qty"></p>
                                <p id="order-rsv-time"></p>
                            </div>
                        </div>
                        <a id="order-link" href="#" class="text-xs text-receiver hover:underline shrink-0">查看貼文 →</a>
                    </div>
                </div>

                <!-- 訊息列表 -->
                <div id="chat-messages" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

                <!-- 輸入框 -->
                <div class="bg-white border-t border-gray-100 px-4 py-3 flex gap-2 shrink-0">
                    <textarea id="msg-input" rows="1" placeholder="輸入訊息…"
                        class="flex-1 resize-none px-4 py-2.5 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-receiver bg-gray-50 max-h-32"></textarea>
                    <button id="send-btn"
                        class="px-5 py-2.5 bg-receiver hover:bg-teal-600 text-white font-bold rounded-2xl text-sm transition shrink-0">
                        傳送
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
    import { getCurrentUserSnapshot, loadUserProfile } from './user-store.js';

    const snapshot = getCurrentUserSnapshot();
    const uid = snapshot?.uid ?? null;

    // URL params（從 detail.html 帶過來）
    const params     = new URLSearchParams(window.location.search);
    const initWith   = params.get('with');       // 對方 uid
    const initPostId = params.get('post');        // food_post_id（可選）

    // ── DOM refs ────────────────────────────────────────────
    const convList      = document.getElementById('conv-list');
    const chatPanel     = document.getElementById('chat-panel');
    const chatEmpty     = document.getElementById('chat-empty');
    const chatBody      = document.getElementById('chat-body');
    const chatMessages  = document.getElementById('chat-messages');
    const chatAvatar    = document.getElementById('chat-avatar');
    const chatName      = document.getElementById('chat-name');
    const msgInput      = document.getElementById('msg-input');
    const sendBtn       = document.getElementById('send-btn');
    const backBtn       = document.getElementById('back-btn');
    const sidebar       = document.getElementById('sidebar');
    const orderCard     = document.getElementById('order-card');
    const toggleOrderBtn = document.getElementById('toggle-order-btn');
    const fullscreenBtn     = document.getElementById('fullscreen-btn');
    const fullscreenBtnText = document.getElementById('fullscreen-btn-text');
    const fullscreenSvg     = document.getElementById('fullscreen-svg');
    let isFullscreen        = false;

    // 目前對話的狀態
    let currentOther   = null;
    let currentPostId  = null;
    let pollTimer      = null;
    let currentOtherName = '';
    let currentFoodTitle = '';
    let isThreadFirstLoad = false;

    if (!uid) {
        convList.innerHTML = '<p class="text-center text-gray-400 text-sm py-10">請先登入才能使用私訊</p>';
    } else {
        // 登入後同步使用者到 DB
        const profile = loadUserProfile(uid, snapshot);
        const fd = new FormData();
        fd.append('firebase_uid', uid);
        fd.append('email', snapshot.email || '');
        fd.append('display_name', profile.displayName || '');
        fetch('/api/users/sync', { method: 'POST', body: fd }).catch(() => {});

        loadConversations();

        // 若 URL 帶了 ?with=xxx，直接開啟對話
        if (initWith) {
            let parsedPost = null;
            if (initPostId && initPostId !== 'null' && initPostId !== 'undefined') {
                const parsed = parseInt(initPostId);
                if (!isNaN(parsed)) {
                    parsedPost = parsed;
                }
            }
            openChat(initWith, parsedPost);
        }
    }

    // ── 載入對話列表 ────────────────────────────────────────
    async function loadConversations() {
        try {
            const res  = await fetch(`/api/messages/conversations/${uid}`);
            const data = await res.json();
            renderConvList(data);
        } catch {
            convList.innerHTML = '<p class="text-center text-red-400 text-sm py-10">載入失敗</p>';
        }
    }

    function renderConvList(convs) {
        // 檢查當前的對話是否已經在 list 中
        if (currentOther) {
            const hasConv = convs.some(c => c.other_uid === currentOther && (c.food_post_id ?? null) === (currentPostId ?? null));
            if (!hasConv) {
                // 如果不在 list 中，手動將其新增到最上方作為臨時項目
                convs.unshift({
                    other_uid: currentOther,
                    other_name: currentOtherName || '對話對象',
                    food_post_id: currentPostId,
                    food_title: currentFoodTitle ? currentFoodTitle.replace(/^[^\s]+\s/, '') : '', // 移除 emoji 標頭
                    last_message: '（尚未發送訊息）',
                    last_time: null,
                    unread: 0
                });
            }
        }

        if (convs.length === 0 && !initWith) {
            convList.innerHTML = '<p class="text-center text-gray-400 text-sm py-10">目前沒有對話</p>';
            return;
        }
        convList.innerHTML = convs.map(c => {
            const initials = (c.other_name || '?').slice(0, 2);
            const timeStr  = c.last_time ? new Date(c.last_time).toLocaleString(undefined, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
            const isActive = c.other_uid === currentOther && (c.food_post_id ?? null) === (currentPostId ?? null);
            return `
            <div class="conv-item flex items-start gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50 transition ${isActive ? 'bg-teal-50' : ''}"
                 data-uid="${c.other_uid}" data-post="${c.food_post_id ?? ''}">
                <div class="w-10 h-10 rounded-full bg-receiver text-white font-bold flex items-center justify-center text-sm shrink-0">${initials}</div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-baseline gap-1">
                        <span class="font-semibold text-gray-800 text-sm truncate">${c.other_name}</span>
                        <span class="text-xs text-gray-400 shrink-0">${timeStr}</span>
                    </div>
                    ${c.food_title ? `<p class="text-xs text-receiver truncate">🍱 ${c.food_title}</p>` : ''}
                    <p class="text-xs text-gray-500 truncate">${c.last_message}</p>
                </div>
                ${c.unread > 0 ? `<span class="w-5 h-5 rounded-full bg-receiver text-white text-xs font-bold flex items-center justify-center shrink-0">${c.unread}</span>` : ''}
            </div>`;
        }).join('');

        convList.querySelectorAll('.conv-item').forEach(el => {
            el.addEventListener('click', () => {
                const postId = el.dataset.post ? parseInt(el.dataset.post) : null;
                openChat(el.dataset.uid, postId);
            });
        });
    }

    // ── 開啟指定對話 ────────────────────────────────────────
    async function openChat(otherUid, postId = null) {
        currentOther  = otherUid;
        currentPostId = (postId && !isNaN(postId)) ? postId : null;
        isThreadFirstLoad = true;

        chatEmpty.classList.add('hidden');
        chatBody.classList.remove('hidden');
        chatBody.classList.add('flex');
        chatPanel.classList.remove('hidden');
        chatPanel.classList.add('flex');

        chatMessages.innerHTML = '<p class="text-center text-gray-400 text-sm py-6">載入中…</p>';

        clearInterval(pollTimer);
        await fetchThread();
        pollTimer = setInterval(fetchThread, 3000);
    }

    async function fetchThread() {
        try {
            const qs  = currentPostId != null ? `?food_post_id=${currentPostId}` : '';
            const res = await fetch(`/api/messages/thread/${uid}/${currentOther}${qs}`);
            const data = await res.json();
            renderThread(data);
            loadConversations(); // 更新未讀數
        } catch {}
    }

    function renderThread(data) {
        // 頂部資訊
        currentOtherName = data.other_name || '對話對象';
        currentFoodTitle = data.order_info ? data.order_info.title : '';

        chatAvatar.textContent = currentOtherName.slice(0, 2);
        chatName.textContent   = currentOtherName;

        // 訂單資訊卡
        if (data.order_info) {
            const o = data.order_info;
            toggleOrderBtn.classList.remove('hidden');
            document.getElementById('order-title').textContent    = `${o.emoji || '🍱'} ${o.title}`;
            document.getElementById('order-location').textContent = `📍 ${o.location}`;
            document.getElementById('order-status').textContent   = `狀態：${o.status}`;
            document.getElementById('order-link').href            = `./detail.html?id=${o.food_id}`;

            const hero = document.getElementById('order-hero');
            if (o.image_path) {
                hero.innerHTML = `<img src="${o.image_path}" class="w-full h-full object-cover">`;
            } else {
                hero.textContent = o.emoji || '🍱';
            }

            if (o.rsv_name) {
                document.getElementById('order-rsv').classList.remove('hidden');
                document.getElementById('order-rsv-name').textContent = `姓名：${o.rsv_name}`;
                document.getElementById('order-rsv-sid').textContent  = `學號：${o.rsv_student_id || '—'}`;
                document.getElementById('order-rsv-qty').textContent  = `份數：${o.rsv_qty}`;
                document.getElementById('order-rsv-time').textContent = `預計領取：${o.rsv_pickup_time || '—'}`;
            }

            if (isThreadFirstLoad) {
                orderCard.classList.remove('hidden');
                toggleOrderBtn.textContent = '收起 ▴';
                isThreadFirstLoad = false;
            }
        } else {
            toggleOrderBtn.classList.add('hidden');
            orderCard.classList.add('hidden');
        }

        // 訊息氣泡
        const wasAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop <= chatMessages.clientHeight + 60;
        chatMessages.innerHTML = data.messages.length === 0
            ? '<p class="text-center text-gray-400 text-sm py-6">還沒有訊息，說聲Hi吧！</p>'
            : data.messages.map(m => {
                const isMe   = m.sender_uid === uid;
                const timeStr = new Date(m.created_at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                return `
                <div class="flex ${isMe ? 'justify-end' : 'justify-start'} gap-2">
                    ${!isMe ? `<div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 font-bold flex items-center justify-center text-xs shrink-0 self-end">${(data.other_name||'?').slice(0,2)}</div>` : ''}
                    <div class="max-w-[72%]">
                        <div class="px-4 py-2.5 text-sm leading-relaxed ${isMe ? 'bubble-me' : 'bubble-other'}">${escHtml(m.content)}</div>
                        <p class="text-xs text-gray-400 mt-0.5 ${isMe ? 'text-right' : 'text-left'}">${timeStr}${isMe && m.is_read ? ' ✓✓' : ''}</p>
                    </div>
                </div>`;
            }).join('');

        if (wasAtBottom || data.messages.length <= 1) {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    // ── 傳送訊息 ────────────────────────────────────────────
    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !currentOther) return;

        msgInput.value = '';
        sendBtn.disabled = true;

        const fd = new FormData();
        fd.append('sender_uid',   uid);
        fd.append('receiver_uid', currentOther);
        fd.append('content',      text);
        if (currentPostId != null) fd.append('food_post_id', currentPostId);

        try {
            await fetch('/api/messages', { method: 'POST', body: fd });
            await fetchThread();
        } catch {
            msgInput.value = text;
        } finally {
            sendBtn.disabled = false;
            msgInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // 訂單卡收合
    toggleOrderBtn.addEventListener('click', () => {
        const hidden = orderCard.classList.toggle('hidden');
        toggleOrderBtn.textContent = hidden ? '查看訂單資訊 ▾' : '收起 ▴';
    });

    // 全螢幕切換邏輯
    function toggleFullscreen() {
        isFullscreen = !isFullscreen;
        if (isFullscreen) {
            sidebar.classList.add('hidden');
            backBtn.classList.remove('hidden');
            fullscreenBtnText.textContent = '視窗化';
            fullscreenSvg.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H6m4 0v4m4-4h4m-4 0v4M14 10h4m-4 0V6m-8 4H4m4 0V6" />
            `;
        } else {
            sidebar.classList.remove('hidden');
            backBtn.classList.add('hidden');
            fullscreenBtnText.textContent = '全螢幕';
            fullscreenSvg.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4" />
            `;
        }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // 手機版返回 (當在全螢幕模式下)
    backBtn.addEventListener('click', () => {
        if (isFullscreen) {
            toggleFullscreen();
        }
    });

    // 頁面離開時清 timer
    window.addEventListener('beforeunload', () => clearInterval(pollTimer));
    </script>
</body>
</html>
