<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pt-24">
    <script src="./header.js?v999"></script>

    <main class="max-w-6xl mx-auto w-full p-6 space-y-8">
        <h1 id="page-title" class="text-2xl font-bold text-giver">分享清單</h1>
        <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 md:p-6">
            <div class="flex items-center justify-between gap-4 flex-wrap">
                <div>
                    <p class="text-sm text-gray-500">你的分享資料會綁定目前登入帳號</p>
                    <p id="profile-key" class="font-semibold text-gray-900">已同步到個人帳號</p>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="rounded-xl bg-orange-50 px-4 py-3 border border-orange-100">
                        <p class="text-gray-500 text-xs">進行中</p>
                        <p id="share-count" class="text-2xl font-extrabold text-giver">0</p>
                    </div>
                    <div class="rounded-xl bg-teal-50 px-4 py-3 border border-teal-100">
                        <p class="text-gray-500 text-xs">已完成</p>
                        <p id="share-finished-count" class="text-2xl font-extrabold text-receiver">0</p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-900 flex items-center">
                    <span class="w-3 h-6 bg-giver rounded-full mr-2 inline-block"></span>
                    你的分享清單
                </h2>
                <span id="empty-note" class="text-xs text-gray-400 hidden">目前沒有分享紀錄</span>
            </div>
            <div id="share-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>
    </main>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile } from './user-store.js';

        const snapshot = getCurrentUserSnapshot();

        if (!snapshot?.uid) {
            document.getElementById('page-title').textContent = '請先登入';
            document.getElementById('profile-key').textContent = '登入後才能查看分享清單';
        } else {
            const profile = loadUserProfile(snapshot.uid, snapshot);
            const name = profile.displayName || snapshot.email?.split('@')[0] || '我的';
            document.getElementById('page-title').textContent = `${name} 的分享清單`;
            loadShares(snapshot.uid);
        }

        // 刪除食物
        window.deleteFood = async function(foodId) {
            if (!confirm('確定要刪除這筆分享嗎？')) return;
            const data = new FormData();
            data.append('sharer_uid', snapshot.uid);
            const res = await fetch(`/api/foods/${foodId}`, { method: 'DELETE', body: data });
            if (res.ok) {
                loadShares(snapshot.uid);
            } else {
                const json = await res.json();
                alert(json.detail || '刪除失敗');
            }
        };

        async function loadShares(uid) {
            try {
                const res   = await fetch(`/api/users/${uid}/shares`);
                const items = await res.json();
                renderShares(items);
            } catch (err) {
                document.getElementById('profile-key').textContent = '載入失敗，請確認伺服器是否啟動';
            }
        }

        function renderShares(items) {
            const activeCount   = items.filter(i => i.status !== '已完成').length;
            const finishedCount = items.filter(i => i.status === '已完成').length;

            document.getElementById('share-count').textContent         = String(activeCount);
            document.getElementById('share-finished-count').textContent = String(finishedCount);

            const listEl    = document.getElementById('share-list');
            const emptyNote = document.getElementById('empty-note');

            if (items.length === 0) {
                emptyNote?.classList.remove('hidden');
                listEl.innerHTML = '';
                return;
            }
            emptyNote?.classList.add('hidden');

            listEl.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 hover:border-giver hover:shadow-md transition overflow-hidden group">
                    <a href="${item.href}" class="block p-4 flex items-start space-x-4">
                        ${item.image_path
                            ? `<img src="${item.image_path}" class="w-20 h-20 rounded-xl object-cover shrink-0">`
                            : `<div class="w-20 h-20 bg-orange-50 rounded-xl flex items-center justify-center text-3xl shrink-0">${item.emoji || '🎁'}</div>`
                        }
                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-start mb-1 gap-2">
                                <span class="bg-giver text-white text-xs font-bold px-2 py-0.5 rounded shadow-sm">${item.status}</span>
                                <span class="text-xs text-gray-400 whitespace-nowrap">${item.timeLabel}</span>
                            </div>
                            <h3 class="font-bold text-gray-900 text-base mb-1 truncate group-hover:text-orange-600 transition">${item.title}</h3>
                            <p class="text-sm text-gray-500 flex items-center truncate">📍 ${item.location}</p>
                        </div>
                    </a>
                    <div class="px-4 pb-3 pt-0 flex gap-2 border-t border-gray-50">
                        <a href="./upload.html?edit=${item.id}"
                           class="flex-1 text-center text-xs font-semibold py-1.5 rounded-lg border border-giver text-giver hover:bg-orange-50 transition">
                            ✏️ 編輯
                        </a>
                        <button onclick="deleteFood(${item.id})"
                                class="flex-1 text-xs font-semibold py-1.5 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition">
                            🗑 刪除
                        </button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
