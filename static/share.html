<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center">
            <a href="../index.html" class="text-gray-500 hover:text-giver transition mr-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </a>
            <div>
                <p class="text-xs text-gray-400">目前登入者</p>
                <h1 id="page-title" class="text-xl font-bold text-giver">分享清單</h1>
            </div>
        </div>
        <a href="./upload.html" class="bg-giver hover:bg-orange-400 text-white px-4 py-2 rounded-full text-sm font-medium transition shadow-sm">＋ 馬上分享</a>
    </header>

    <main class="max-w-6xl mx-auto w-full p-6 space-y-8">
        <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 md:p-6">
            <div class="flex items-center justify-between gap-4 flex-wrap">
                <div>
                    <p class="text-sm text-gray-500">你的分享資料會綁定目前登入帳號</p>
                    <p id="profile-key" class="font-semibold text-gray-900">已同步到個人帳號</p>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="rounded-xl bg-orange-50 px-4 py-3 border border-orange-100">
                        <p class="text-gray-500 text-xs">進行中</p>
                        <p id="share-count" class="text-2xl font-extrabold text-giver">0</p>
                    </div>
                    <div class="rounded-xl bg-teal-50 px-4 py-3 border border-teal-100">
                        <p class="text-gray-500 text-xs">已完成</p>
                        <p id="share-finished-count" class="text-2xl font-extrabold text-receiver">0</p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-900 flex items-center">
                    <span class="w-3 h-6 bg-giver rounded-full mr-2 inline-block"></span>
                    你的分享清單
                </h2>
                <span id="empty-note" class="text-xs text-gray-400 hidden">目前沒有分享紀錄</span>
            </div>
            <div id="share-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>
    </main>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile, getProfileKey } from './user-store.js';

        const demoShares = [
            { id: 1, title: '多出的黑糖珍珠鮮奶', emoji: '🧋', location: '男生宿舍大廳', timeLabel: '已發布 1 小時', href: './detail.html?id=1', status: '進行中' },
            { id: 2, title: '會議多餘的排骨便當', emoji: '🍱', location: '社管大樓 4 樓', timeLabel: '已發布 3 小時', href: './detail.html?id=2', status: '進行中' }
        ];

        function renderShares(profile, user) {
            const titleEl = document.getElementById('page-title');
            const keyEl = document.getElementById('profile-key');
            const countEl = document.getElementById('share-count');
            const finishedEl = document.getElementById('share-finished-count');
            const listEl = document.getElementById('share-list');
            const emptyNote = document.getElementById('empty-note');

            const items = profile.shareHistory.length ? profile.shareHistory : demoShares;
            const activeCount = profile.shareHistory.length;
            const finishedCount = profile.shareHistory.filter((item) => item.status === '已完成' || item.completed).length;

            if (titleEl) titleEl.textContent = `${profile.displayName || user?.email?.split('@')[0] || '我的'} 的分享清單`;
            if (keyEl) keyEl.textContent = user?.uid ? '已同步到個人帳號' : '未登入時使用展示資料';
            if (countEl) countEl.textContent = String(activeCount);
            if (finishedEl) finishedEl.textContent = String(finishedCount);

            if (!listEl) return;
            listEl.innerHTML = items.map((item) => `
                <a href="${item.href || './detail.html'}" class="block bg-white rounded-2xl shadow-sm border border-gray-100 hover:border-giver hover:shadow-md transition overflow-hidden group">
                    <div class="p-4 flex items-start space-x-4">
                        <div class="w-20 h-20 bg-orange-50 rounded-xl flex items-center justify-center text-3xl shrink-0">${item.emoji || '🎁'}</div>
                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-start mb-1 gap-2">
                                <span class="bg-giver text-white text-xs font-bold px-2 py-0.5 rounded shadow-sm">${item.status || '進行中'}</span>
                                <span class="text-xs text-gray-400 whitespace-nowrap">${item.timeLabel || '剛剛發布'}</span>
                            </div>
                            <h3 class="font-bold text-gray-900 text-base mb-1 truncate group-hover:text-orange-600 transition">${item.title || '未命名分享項目'}</h3>
                            <p class="text-sm text-gray-500 flex items-center truncate">📍 ${item.location || '未填寫地點'}</p>
                        </div>
                    </div>
                </a>
            `).join('');

            if (emptyNote) {
                emptyNote.classList.toggle('hidden', profile.shareHistory.length !== 0);
            }
        }

        const snapshot = getCurrentUserSnapshot();
        if (snapshot?.uid) {
            const profile = loadUserProfile(snapshot.uid, snapshot);
            renderShares(profile, snapshot);
        } else {
            renderShares({ shareHistory: [] }, null);
        }

        window.addEventListener('storage', (event) => {
            if (!snapshot?.uid || event.key !== getProfileKey(snapshot.uid)) return;
            const nextProfile = loadUserProfile(snapshot.uid, snapshot);
            renderShares(nextProfile, snapshot);
        });
    </script>
</body>
</html>
