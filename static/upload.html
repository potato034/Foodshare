<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳分享食物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
    <!-- Leaflet 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pt-24">
    <script src="./header.js"></script>

    <main class="max-w-2xl mx-auto py-8 px-4">
        <h1 id="page-title" class="text-2xl font-bold text-giver mb-4">上傳食物</h1>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="mb-6 rounded-xl border border-gray-100 bg-orange-50/50 p-4 text-sm text-gray-600">
                送出後會直接加入目前使用者的分享清單，並同步到首頁與個人檔案。
            </div>

            <form id="upload-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">上傳食物相片</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-giver hover:bg-orange-50 transition cursor-pointer" onclick="document.getElementById('file-upload').click()">
                        <div class="space-y-1 text-center">
                            <div class="relative inline-block mx-auto mb-4">
                                <img id="image-preview" class="h-32 object-cover hidden rounded-lg" />
                                <button type="button" id="delete-image-btn" 
                                        class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hidden shadow-md focus:outline-none transition duration-150 transform hover:scale-110"
                                        title="刪除圖片">×</button>
                            </div>
                            <svg id="upload-icon" class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-giver hover:text-orange-500 focus-within:outline-none">
                                    <span>點擊上傳檔案</span>
                                    <input id="file-upload" name="image" type="file" class="sr-only" accept="image/*" onchange="previewImage(event)">
                                </label>
                                <p class="pl-1">或將圖片拖曳至此</p>
                            </div>
                            <p class="text-xs text-gray-500">支援 PNG, JPG, GIF (最大 5MB)</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="food-name" class="block text-sm font-medium text-gray-700 mb-1">食物名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="food-name" name="title" required placeholder="例如：多出的排骨便當" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">類別 <span class="text-red-500">*</span></label>
                        <select id="category" name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                            <option value="" disabled selected>請選擇類別</option>
                            <option value="便當">便當</option>
                            <option value="飲料">飲料</option>
                            <option value="餐盒">餐盒</option>
                            <option value="甜點">甜點</option>
                            <option value="麵包">麵包</option>
                            <option value="披薩">披薩</option>
                            <option value="炸物">炸物</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>

                <!-- Emoji 選擇器：選完類別後自動帶入預設，點欄位用系統 emoji 鍵盤自由換 -->
                <div class="flex items-start gap-4 p-4 bg-orange-50 rounded-xl border border-orange-100">
                    <div class="shrink-0">
                        <label class="block text-sm font-medium text-gray-700 mb-1">地圖顯示 Emoji</label>
                        <input type="text" id="emoji-input" name="emoji_choice"
                               placeholder="🍱"
                               class="w-16 h-12 text-center text-3xl border border-gray-300 rounded-xl focus:ring-2 focus:ring-giver outline-none bg-white cursor-pointer"
                               maxlength="8" readonly
                               onclick="this.removeAttribute('readonly'); this.focus()">
                    </div>
                    <div class="pt-1">
                        <p class="text-sm font-medium text-gray-700 mb-1">怎麼選 emoji？</p>
                        <p class="text-xs text-gray-500">① 先選左側的「類別」，欄位會自動帶入預設 emoji</p>
                        <p class="text-xs text-gray-500">② 想換其他 emoji：點擊左邊的方框，再按
                            <kbd class="bg-white border border-gray-300 rounded px-1 text-xs">Windows + .</kbd>或是 <kbd class="bg-white border border-gray-300 rounded px-1 text-xs">Control + Command + 空白鍵</kbd>
                            開啟 emoji 鍵盤
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">供應份數 <span class="text-red-500">*</span></label>
                        <input type="number" id="quantity" name="quantity" required min="1" max="999" placeholder="請輸入整數，例如 3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">限時領取 <span class="text-red-500">*</span></label>
                        <div class="flex gap-2">
                            <input type="number" id="time-limit-value" min="1" max="999" value="1"
                                   class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition text-center">
                            <select id="time-limit-unit" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                                <option value="min">分鐘</option>
                                <option value="hour" selected>小時</option>
                            </select>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">逾時後食物將自動下架</p>
                    </div>
                    <div>
                        <label for="waitlist-time-limit" class="block text-sm font-medium text-gray-700 mb-1">遞補後領取時限 <span class="text-red-500">*</span></label>
                        <select id="waitlist-time-limit" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                            <!-- options will be populated dynamically -->
                        </select>
                        <p class="text-xs text-gray-400 mt-1">遞補成功後的專屬領取時限</p>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">領取地點 <span class="text-red-500">*</span></label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <!-- 自訂可搜尋下拉選單 -->
                        <div class="relative w-full sm:w-1/2" id="loc-wrapper">
                            <input type="text" id="main-location-input"
                                   placeholder="搜尋或選擇地標…" autocomplete="off" readonly
                                   class="w-full px-4 py-2 pr-9 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition cursor-pointer bg-white">
                            <!-- 下拉箭頭 -->
                            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs">▾</span>
                            <!-- 隱藏欄位 -->
                            <input type="hidden" name="main_location" id="main-location-hidden">
                            <!-- 下拉選單 -->
                            <div id="loc-dropdown"
                                 class="hidden absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
                                <div class="p-2 border-b border-gray-100">
                                    <input type="text" id="loc-search" placeholder="輸入關鍵字篩選…" autocomplete="off"
                                           class="w-full px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-giver outline-none">
                                </div>
                                <ul id="loc-list" class="max-h-48 overflow-y-auto py-1 text-sm"></ul>
                            </div>
                        </div>
                        <input type="text" name="detail_location" placeholder="詳細位置 (例：4樓系辦外桌上)" class="w-full sm:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition">
                    </div>
                    <p class="text-xs text-gray-500 mt-1">選擇鄰近的地標能幫助索取者在地圖上更快找到喔！</p>
                    <!-- 興大校園地標定位小地圖 -->
                    <div id="upload-map" class="h-60 rounded-xl border border-gray-200 mt-3 shadow-inner relative z-10 overflow-hidden"></div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">詳細內容 (選填)</label>
                    <textarea id="description" name="description" rows="4" placeholder="補充說明食物的狀態，例如：全新未拆封、微糖微冰、請自備環保容器..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none transition resize-none"></textarea>
                </div>

                <!-- 編輯模式才顯示：領取狀態 -->
                <div id="status-field" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">領取狀態</label>
                    <select id="status-select" name="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-giver focus:border-transparent outline-none bg-white transition">
                        <option value="available">🟢 可領取（重新開放）</option>
                        <option value="completed">⚫ 已完成（手動關閉）</option>
                    </select>
                </div>

                <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
                    <a href="./share.html" class="px-4 py-2 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 transition">查看分享清單</a>
                    <button type="submit" class="bg-giver hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition duration-200 transform hover:-translate-y-0.5">確認發布分享</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // 類別 → 預設 emoji 對應表
        const CATEGORY_EMOJI = {
            '便當': '🍱', '飲料': '🧋', '餐盒': '🥡', '甜點': '🍰', '麵包': '🍞', '披薩': '🍕','炸物': '🍟', '其他': '🥪'
        };

        // 選類別時自動帶入預設 emoji（使用者還沒有自己選過的話）
        document.getElementById('category').addEventListener('change', function () {
            const emojiInput = document.getElementById('emoji-input');
            if (!emojiInput.dataset.userPicked) {
                emojiInput.value = CATEGORY_EMOJI[this.value] || '';
            }
        });

        // 使用者自己改了 emoji → 標記為「已自選」，類別切換不再覆蓋
        document.getElementById('emoji-input').addEventListener('input', function () {
            if (this.value.trim()) this.dataset.userPicked = 'true';
        });

        function updateWaitlistOptions(savedValue) {
            const val = parseInt(document.getElementById('time-limit-value').value) || 1;
            const unit = document.getElementById('time-limit-unit').value;
            const maxMins = unit === 'hour' ? val * 60 : val;
            
            const select = document.getElementById('waitlist-time-limit');
            const previousValue = savedValue || parseInt(select.value) || 30;
            select.innerHTML = '';
            
            let optionsAdded = 0;
            for (let m = 15; m <= maxMins; m += 15) {
                const opt = document.createElement('option');
                opt.value = m;
                if (m >= 60 && m % 60 === 0) {
                    opt.textContent = `${m / 60} 小時`;
                } else {
                    opt.textContent = `${m} 分鐘`;
                }
                select.appendChild(opt);
                optionsAdded++;
            }
            
            if (maxMins > 0 && maxMins % 15 !== 0) {
                const opt = document.createElement('option');
                opt.value = maxMins;
                if (maxMins >= 60 && maxMins % 60 === 0) {
                    opt.textContent = `${maxMins / 60} 小時`;
                } else {
                    opt.textContent = `${maxMins} 分鐘`;
                }
                select.appendChild(opt);
                optionsAdded++;
            }

            if (optionsAdded === 0) {
                const opt = document.createElement('option');
                opt.value = Math.max(1, maxMins);
                if (maxMins >= 60 && maxMins % 60 === 0) {
                    opt.textContent = `${maxMins / 60} 小時`;
                } else {
                    opt.textContent = `${maxMins} 分鐘`;
                }
                select.appendChild(opt);
            }
            
            let hasSelected = false;
            for (let i = 0; i < select.options.length; i++) {
                if (parseInt(select.options[i].value) === previousValue) {
                    select.selectedIndex = i;
                    hasSelected = true;
                    break;
                }
            }
            if (!hasSelected) {
                let defaultIdx = -1;
                for (let i = 0; i < select.options.length; i++) {
                    if (parseInt(select.options[i].value) === 30) {
                        defaultIdx = i;
                        break;
                    }
                }
                if (defaultIdx !== -1) {
                    select.selectedIndex = defaultIdx;
                } else {
                    select.selectedIndex = 0;
                }
            }
        }

        document.getElementById('time-limit-value').addEventListener('input', () => updateWaitlistOptions());
        document.getElementById('time-limit-unit').addEventListener('change', () => updateWaitlistOptions());
        updateWaitlistOptions();

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('file-upload').dataset.deleted = 'false';
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const icon = document.getElementById('upload-icon');
                    const deleteBtn = document.getElementById('delete-image-btn');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    if (deleteBtn) deleteBtn.classList.remove('hidden');
                    icon.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        const deleteImageBtn = document.getElementById('delete-image-btn');
        if (deleteImageBtn) {
            deleteImageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const fileInput = document.getElementById('file-upload');
                fileInput.value = '';
                fileInput.dataset.deleted = 'true';
                
                const preview = document.getElementById('image-preview');
                const icon = document.getElementById('upload-icon');
                preview.src = '';
                preview.classList.add('hidden');
                deleteImageBtn.classList.add('hidden');
                icon.classList.remove('hidden');
            });
        }
    </script>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile } from './user-store.js';

        const titleEl = document.getElementById('page-title');
        const form    = document.getElementById('upload-form');
        const submitBtn = form?.querySelector('[type="submit"]');

        // ── 自訂可搜尋地點下拉與小地圖整合 ──────────────────────
        let allLocations = [];
        let locationsData = [];
        let map = null;
        let selectMarker = null;

        const locInput    = document.getElementById('main-location-input');
        const locHidden   = document.getElementById('main-location-hidden');
        const locDropdown = document.getElementById('loc-dropdown');
        const locSearch   = document.getElementById('loc-search');
        const locList     = document.getElementById('loc-list');

        function initUploadMap() {
            try {
                // 中心設在中興大學圖書館附近
                map = L.map('upload-map', {
                    center: [24.122, 120.6755],
                    zoom: 16,
                    zoomControl: true
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                // 建立當前選取地標的紅色定位 Marker
                selectMarker = L.marker([0, 0], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                });

                // 標記所有興大主要地標
                locationsData.forEach(loc => {
                    // 藍色小圓點地標
                    const marker = L.circleMarker([loc.lat, loc.lng], {
                        radius: 8,
                        fillColor: '#A8CBCB', // 鼠尾草綠
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 0.95
                    }).addTo(map);

                    // 綁定地標名稱標籤
                    marker.bindTooltip(loc.name, {
                        permanent: true,
                        direction: 'top',
                        className: 'bg-white border border-gray-200 px-1 py-0.5 rounded text-[10px] font-bold text-gray-700 shadow-sm'
                    });

                    // 點擊地標圓點 -> 連動下拉選單與選取狀態
                    marker.on('click', () => {
                        selectLocation(loc.name);
                    });
                });
            } catch (err) {
                console.error('Initialize upload map failed:', err);
            }
        }

        function renderLocList(keyword = '') {
            const kw = keyword.toLowerCase();
            const filtered = kw
                ? allLocations.filter(n => n.toLowerCase().includes(kw))
                : allLocations;
            locList.innerHTML = filtered.length === 0
                ? '<li class="px-4 py-2 text-gray-400">無符合的地點</li>'
                : filtered.map(name => `
                    <li class="loc-option px-4 py-2 hover:bg-orange-50 hover:text-giver cursor-pointer transition rounded-lg mx-1
                               ${locInput.value === name ? 'bg-orange-50 text-giver font-semibold' : 'text-gray-700'}"
                         data-name="${name}">${name}</li>`
                ).join('');
            locList.querySelectorAll('.loc-option').forEach(li => {
                li.addEventListener('mousedown', e => {
                    e.preventDefault(); // 避免 blur 先觸發
                    selectLocation(li.dataset.name);
                });
            });
        }

        function selectLocation(name) {
            locInput.value  = name;
            locHidden.value = name;
            closeDropdown();

            // 連動小地圖定位
            if (map && locationsData.length > 0) {
                const found = locationsData.find(l => l.name === name);
                if (found) {
                    const pos = [found.lat, found.lng];
                    selectMarker.setLatLng(pos).addTo(map);
                    map.setView(pos, 17, { animate: true, duration: 0.8 });
                }
            }
        }

        function openDropdown() {
            locDropdown.classList.remove('hidden');
            renderLocList(locSearch.value);
            locSearch.value = '';
            locSearch.focus();
        }

        function closeDropdown() {
            locDropdown.classList.add('hidden');
            locSearch.value = '';
        }

        locInput.addEventListener('click', openDropdown);
        locSearch.addEventListener('input', () => renderLocList(locSearch.value));
        locSearch.addEventListener('keydown', e => { if (e.key === 'Escape') closeDropdown(); });

        // 點外面關閉
        document.addEventListener('click', e => {
            if (!document.getElementById('loc-wrapper').contains(e.target)) closeDropdown();
        });

        // 從 API 載入地點並初始化小地圖
        fetch('/api/locations').then(r => r.json()).then(locs => {
            locationsData = locs;
            allLocations = locs.map(l => l.name);
            initUploadMap();

            // 如果已有預填地點 (例如編輯模式載入後)，立刻同步小地圖 Marker
            if (locHidden.value) {
                selectLocation(locHidden.value);
            }
        }).catch(() => {});

        // 頁面標題顯示登入者名字
        const snapshot  = getCurrentUserSnapshot();
        const editId    = new URLSearchParams(window.location.search).get('edit'); // 編輯模式
        if (snapshot?.uid) {
            const profile = loadUserProfile(snapshot.uid, snapshot);
            if (titleEl) titleEl.textContent = `${profile.displayName || snapshot.email?.split('@')[0] || '我的'} 的上傳頁`;

            // 如果是編輯模式，顯示狀態欄並預填表單資料
            if (editId) {
                document.getElementById('page-title').textContent = '編輯分享';
                document.querySelector('[type="submit"]').textContent = '儲存變更';
                document.getElementById('status-field').classList.remove('hidden');
                fetch(`/api/foods/${editId}`).then(r => r.json()).then(food => {
                    document.getElementById('food-name').value   = food.title || '';
                    document.getElementById('category').value    = food.category || '';
                    document.getElementById('emoji-input').value = food.emoji || '';
                    document.getElementById('quantity').value    = food.quantity || '';
                    // 這裡的 time-limit 需要做分鐘/小時的反向轉換以正確填入表單
                    const mins = food.time_limit || 120;
                    if (mins % 60 === 0) {
                        document.getElementById('time-limit-value').value = mins / 60;
                        document.getElementById('time-limit-unit').value = 'hour';
                    } else {
                        document.getElementById('time-limit-value').value = mins;
                        document.getElementById('time-limit-unit').value = 'min';
                    }
                    updateWaitlistOptions(food.waitlist_time_limit || 30);
                    document.getElementById('description').value = food.description || '';
                    // main_location / detail_location 現在 API 直接回傳
                    if (food.main_location) selectLocation(food.main_location);
                    form.elements['detail_location'].value = food.detail_location || '';
                    document.getElementById('emoji-input').dataset.userPicked = 'true';
                    document.getElementById('status-select').value = food.status || 'available';
                    // 有舊圖片就在預覽區顯示
                    if (food.image_path) {
                        const preview = document.getElementById('image-preview');
                        const icon    = document.getElementById('upload-icon');
                        const deleteBtn = document.getElementById('delete-image-btn');
                        preview.src = food.image_path;
                        preview.classList.remove('hidden');
                        if (deleteBtn) deleteBtn.classList.remove('hidden');
                        icon.classList.add('hidden');
                    }
                }).catch(() => {});
            }

            // 登入後把用戶資訊同步到 SQLite（讓 FoodPost 的 FK 能正確指向 users 表）
            const syncData = new FormData();
            syncData.append('firebase_uid', snapshot.uid);
            syncData.append('email', snapshot.email || '');
            syncData.append('display_name', profile.displayName || '');
            fetch('/api/users/sync', { method: 'POST', body: syncData }).catch(() => {});
        } else {
            if (titleEl) titleEl.textContent = '請先登入後再上傳';
        }

        if (form) {
            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const snapshot = getCurrentUserSnapshot();
                if (!snapshot?.uid) {
                    alert('請先登入，才能發布分享。');
                    return;
                }

                // 基本驗證
                const title       = document.getElementById('food-name').value.trim();
                const category    = document.getElementById('category').value;
                const quantity    = document.getElementById('quantity').value.trim();
                const timeLimitVal  = parseInt(document.getElementById('time-limit-value').value) || 1;
                const timeLimitUnit = document.getElementById('time-limit-unit').value;
                const timeLimit     = timeLimitUnit === 'hour' ? timeLimitVal * 60 : timeLimitVal; // 統一轉分鐘
                const waitlistLimit = parseInt(document.getElementById('waitlist-time-limit').value) || 30;
                const mainLoc     = document.getElementById('main-location-hidden').value
                                   || document.getElementById('main-location-input').value;
                const detailLoc   = form.elements['detail_location'].value.trim();
                const description = document.getElementById('description').value.trim();
                const fileInput   = document.getElementById('file-upload');

                if (!title || !category || !quantity || !timeLimit || !mainLoc) {
                    alert('請先填完所有必填欄位（＊）');
                    return;
                }

                // 組成 FormData 送到 API
                const emojiChoice = document.getElementById('emoji-input').value.trim();
                const data = new FormData();
                data.append('sharer_uid',      snapshot.uid);
                data.append('title',           title);
                data.append('emoji_choice',    emojiChoice);
                data.append('category',        category);
                data.append('quantity',        quantity);
                data.append('time_limit',      timeLimit);
                data.append('waitlist_time_limit', waitlistLimit);
                data.append('main_location',   mainLoc);
                data.append('detail_location', detailLoc);
                data.append('description',     description);
                const isImageDeleted = fileInput.dataset.deleted === 'true';
                data.append('delete_image', isImageDeleted);
                if (fileInput.files[0]) {
                    data.append('file', fileInput.files[0]);
                }

                // 送出，鎖住按鈕避免重複點
                const isEdit = !!editId;
                if (isEdit) {
                    const statusVal = document.getElementById('status-select')?.value;
                    if (statusVal) data.append('status', statusVal);
                }
                if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = isEdit ? '儲存中…' : '發布中…'; }
                try {
                    const url    = isEdit ? `/api/foods/${editId}` : '/api/foods';
                    const method = isEdit ? 'PUT' : 'POST';
                    const res    = await fetch(url, { method, body: data });
                    const json   = await res.json();
                    if (!res.ok) throw new Error(json.detail || (isEdit ? '儲存失敗' : '發布失敗'));
                    alert(isEdit ? '已儲存變更 ✅' : '發布成功！已加入分享清單 🎉', () => {
                        window.location.href = './share.html';
                    });
                } catch (err) {
                    alert(`操作失敗：${err.message}`);
                    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = isEdit ? '儲存變更' : '確認發布分享'; }
                }
            });
        }
    </script>
</body>
</html>
