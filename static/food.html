<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的覓食清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col pt-24">
    <script src="./header.js"></script>

    <main class="max-w-5xl mx-auto w-full p-6 space-y-8 flex-grow">
        <h1 id="page-title" class="text-2xl font-bold text-receiver">我的覓食清單</h1>
        <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 md:p-6">
            <div class="flex items-center justify-between gap-4 flex-wrap">
                <div>
                    <p class="text-sm text-gray-500">吃飽飽</p>
                    <p id="profile-key" class="font-semibold text-gray-900">睡好好</p>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="rounded-xl bg-teal-50 px-4 py-3 border border-teal-100">
                        <p class="text-gray-500 text-xs">待處理</p>
                        <p id="request-count" class="text-2xl font-extrabold text-receiver">0</p>
                    </div>
                    <div class="rounded-xl bg-gray-50 px-4 py-3 border border-gray-100">
                        <p class="text-gray-500 text-xs">完成</p>
                        <p id="request-finished-count" class="text-2xl font-extrabold text-gray-700">0</p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-900 flex items-center">
                    <span class="w-3 h-6 bg-receiver rounded-full mr-2 inline-block"></span>
                    尚未領取
                </h2>
                <span id="empty-note" class="text-xs text-gray-400 hidden">目前沒有覓食紀錄</span>
            </div>
            <div id="request-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

        <section>
            <h2 class="text-lg font-bold text-gray-400 mb-4 flex items-center">
                <span class="w-3 h-6 bg-gray-300 rounded-full mr-2 inline-block"></span>
                歷史紀錄
            </h2>
            <div id="history-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 opacity-80"></div>
        </section>
    </main>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile } from './user-store.js';

        const snapshot = getCurrentUserSnapshot();

        if (!snapshot?.uid) {
            document.getElementById('page-title').textContent = '請先登入';
            document.getElementById('profile-key').textContent = '登入後才能查看覓食清單';
        } else {
            const profile = loadUserProfile(snapshot.uid, snapshot);
            const name = profile.displayName || snapshot.email?.split('@')[0] || '我的';
            document.getElementById('page-title').textContent = `${name} 的覓食清單`;
            loadRequests(snapshot.uid);
        }

        async function loadRequests(uid) {
            try {
                const res   = await fetch(`/api/users/${uid}/requests`);
                const items = await res.json();
                renderAll(items);
            } catch (err) {
                document.getElementById('profile-key').textContent = '載入失敗，請確認伺服器是否啟動';
            }
        }

        function renderAll(items) {
            // 依預約狀態分成「尚未領取」和「歷史紀錄」
            const pending = items.filter(i => i.status === '待領取' || i.status.startsWith('候位中'));
            const history = items.filter(i => i.status === '已完成' || i.status === '已取消' || i.status === '未取');

            document.getElementById('request-count').textContent         = String(pending.length);
            document.getElementById('request-finished-count').textContent = String(history.filter(i => i.status === '已完成').length);
            document.getElementById('empty-note').classList.toggle('hidden', pending.length !== 0);

            renderList(document.getElementById('request-list'), pending, 'request');
            renderList(document.getElementById('history-list'), history, 'history');
        }

        function renderList(listEl, items, mode) {
            if (!listEl) return;
            if (items.length === 0) { listEl.innerHTML = ''; return; }

            const formatDeadline = (isoString) => {
                if (!isoString) return '';
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return '';
                const mm = String(date.getMonth() + 1).padStart(2, '0');
                const dd = String(date.getDate()).padStart(2, '0');
                const hh = String(date.getHours()).padStart(2, '0');
                const min = String(date.getMinutes()).padStart(2, '0');
                return `🔴 領取期限：${mm}/${dd} ${hh}:${min} 前`;
            };

            // 卡片 HTML 結構與原本完全相同，資料來源改成 API
            listEl.innerHTML = items.map(item => `
                <a href="${item.href}" class="block bg-white rounded-xl shadow-sm border ${mode === 'request' ? 'border-receiver/30 hover:border-receiver' : 'border-gray-200 hover:border-gray-300'} hover:shadow-md transition duration-200 overflow-hidden">
                    <div class="p-4 flex items-start space-x-4">
                        <div class="w-20 h-20 ${mode === 'request' ? 'bg-teal-50' : 'bg-gray-100'} rounded-lg flex items-center justify-center text-3xl shrink-0 ${mode === 'history' ? 'grayscale' : ''}">${item.emoji || '🍴'}</div>
                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-start mb-1 gap-2">
                                <span class="${mode === 'request' ? 'bg-receiver text-white' : 'bg-gray-300 text-gray-700'} text-xs font-bold px-2 py-0.5 rounded shadow-sm">${item.status}</span>
                                <span class="text-xs text-gray-400 whitespace-nowrap">${item.timeLabel}</span>
                            </div>
                            <h3 class="font-bold ${mode === 'request' ? 'text-gray-900' : 'text-gray-600'} text-base mb-1 truncate">${item.title}</h3>
                            <p class="text-sm ${mode === 'request' ? 'text-gray-500' : 'text-gray-400'} truncate">📍 ${item.location}</p>
                            ${item.pickup_deadline ? `<p class="text-xs font-semibold text-red-500 mt-1.5">${formatDeadline(item.pickup_deadline)}</p>` : ''}
                        </div>
                    </div>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
