<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的覓食清單 - ForageMap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center">
            <a href="/" class="text-gray-500 hover:text-receiver transition mr-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </a>
            <span class="text-xl font-bold text-receiver">我的覓食清單</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-6">
        
        <section class="mb-10">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                <span class="w-3 h-6 bg-receiver rounded-full mr-2 inline-block animate-pulse"></span>
                尚未領取 (待處理)
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <a href="/static/detail.html" class="block bg-white rounded-xl shadow-sm border-2 border-receiver/30 hover:border-receiver hover:shadow-md transition duration-200 overflow-hidden relative group">
                    <div class="p-4 flex items-start space-x-4">
                        <div class="w-20 h-20 bg-teal-50 rounded-lg flex items-center justify-center text-3xl shrink-0">🍱</div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-1">
                                <span class="bg-receiver text-white text-xs font-bold px-2 py-0.5 rounded shadow-sm">待領取</span>
                                <span class="text-xs text-gray-400">約好的時間：12:00</span>
                            </div>
                            <h3 class="font-bold text-gray-900 text-base mb-1 group-hover:text-teal-700 transition">會議多餘的排骨便當</h3>
                            <p class="text-sm text-gray-500 flex items-center">
                                📍 社管大樓 4 樓
                            </p>
                        </div>
                    </div>
                </a>
            </div>
        </section>

        <section>
            <h2 class="text-lg font-bold text-gray-400 mb-4 flex items-center">
                <span class="w-3 h-6 bg-gray-300 rounded-full mr-2 inline-block"></span>
                歷史紀錄 (已領取)
            </h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 opacity-75">
                <a href="/static/detail.html" class="block bg-gray-50 rounded-xl shadow-sm border border-gray-200 hover:shadow transition duration-200 overflow-hidden">
                    <div class="p-4 flex items-start space-x-4 grayscale group-hover:grayscale-0 transition duration-300">
                        <div class="w-20 h-20 bg-orange-100 rounded-lg flex items-center justify-center text-3xl shrink-0">🧋</div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-1">
                                <span class="bg-gray-300 text-gray-700 text-xs font-bold px-2 py-0.5 rounded">已完成</span>
                                <span class="text-xs text-gray-400">昨天</span>
                            </div>
                            <h3 class="font-bold text-gray-600 text-base mb-1">多出的黑糖珍珠鮮奶</h3>
                            <p class="text-sm text-gray-400">📍 男生宿舍大廳</p>
                        </div>
                    </div>
                </a>

                <a href="/static/detail.html" class="block bg-gray-50 rounded-xl shadow-sm border border-gray-200 hover:shadow transition duration-200 overflow-hidden">
                    <div class="p-4 flex items-start space-x-4 grayscale group-hover:grayscale-0 transition duration-300">
                        <div class="w-20 h-20 bg-yellow-100 rounded-lg flex items-center justify-center text-3xl shrink-0">🍰</div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-1">
                                <span class="bg-gray-300 text-gray-700 text-xs font-bold px-2 py-0.5 rounded">已完成</span>
                                <span class="text-xs text-gray-400">3/15</span>
                            </div>
                            <h3 class="font-bold text-gray-600 text-base mb-1">巧克力鮮 cream 蛋糕</h3>
                            <p class="text-sm text-gray-400">📍 女生宿舍交誼廳</p>
                        </div>
                    </div>
                </a>
            </div>
        </section>

    </main>
</body>
</html>
