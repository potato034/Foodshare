<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物詳細資訊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <button onclick="history.back()" class="text-gray-500 hover:text-receiver transition flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            返回
        </button>
    </header>

    <main class="max-w-2xl mx-auto py-6 px-4">
        
        <div class="w-full h-64 bg-teal-50 rounded-2xl flex items-center justify-center text-7xl shadow-inner mb-6">
            🍱
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
            <div class="flex justify-between items-center mb-3">
                <div class="flex space-x-2">
                    <span class="bg-receiver text-white text-xs font-bold px-3 py-1 rounded shadow-sm">待領取</span>
                    <span class="bg-teal-50 text-teal-600 border border-teal-100 text-xs font-semibold px-2 py-1 rounded">便當</span>
                </div>
                <span class="text-sm text-gray-400">發布於 1 小時前</span>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mb-6">會議多餘的排骨便當</h1>

            <div class="flex items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-100 mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-giver text-white rounded-full flex items-center justify-center font-bold">
                        小明
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">分享者</p>
                        <p class="font-bold text-gray-800">經濟系 小明</p>
                    </div>
                </div>
                <a href="/static/message.html" class="flex items-center space-x-1 text-sm bg-white border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                    <span>發送私訊</span>
                </a>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">📍 領取地點</p>
                    <p class="font-semibold text-gray-800 text-sm">社管大樓 4 樓 (系辦外長桌)</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">⏰ 領取時間</p>
                    <p class="font-semibold text-gray-800 text-sm">今天 14:00 前</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">📦 數量/份量</p>
                    <p class="font-semibold text-gray-800 text-sm">共 3 個 (可單獨領取)</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">⏳ 狀態</p>
                    <p class="font-semibold text-receiver text-sm">等待你來領取</p>
                </div>
            </div>

            <div class="mb-8 border-t border-gray-100 pt-6">
                <h3 class="text-sm font-bold text-gray-900 mb-2">詳細說明：</h3>
                <p class="text-gray-600 text-sm leading-relaxed">
                    系辦中午開會多出 3 個排骨便當，皆全新未動，有附筷子跟衛生紙，歡迎自取。請拿走的時候盡量保持桌面乾淨喔，謝謝！
                </p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button class="flex-1 bg-receiver hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition duration-200 transform hover:-translate-y-0.5 text-center">
                    ✅ 我已成功領取
                </button>
                <button class="sm:w-1/3 bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-600 font-bold py-3 px-4 rounded-xl transition text-center">
                    取消申請
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 mt-3">點擊「我已成功領取」後，系統會通知分享者並更改狀態</p>

        </div>
    </main>
</body>
</html>
