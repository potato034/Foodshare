<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物詳細資訊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        giver: '#FBB28B',
                        receiver: '#A8CBCB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pt-24">

    <script src="./header.js?v999"></script>

    <main class="max-w-2xl mx-auto py-6 px-4">

        <!-- 食物圖示區 -->
        <div id="food-hero" class="w-full h-64 bg-teal-50 rounded-2xl flex items-center justify-center text-7xl shadow-inner mb-6">
            ⏳
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">

            <!-- 狀態標籤 + 時間 -->
            <div class="flex justify-between items-center mb-3">
                <div class="flex space-x-2">
                    <span id="detail-status-badge" class="bg-receiver text-white text-xs font-bold px-3 py-1 rounded shadow-sm">載入中</span>
                    <span id="detail-category-badge" class="bg-teal-50 text-teal-600 border border-teal-100 text-xs font-semibold px-2 py-1 rounded"></span>
                </div>
                <span id="detail-time-ago" class="text-sm text-gray-400"></span>
            </div>

            <!-- 標題 -->
            <h1 id="detail-title" class="text-2xl font-bold text-gray-900 mb-6">載入中…</h1>

            <!-- 分享者資訊 -->
            <div class="flex items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-100 mb-6">
                <div class="flex items-center space-x-3">
                    <div id="detail-sharer-avatar" class="w-10 h-10 bg-giver text-white rounded-full flex items-center justify-center font-bold text-sm">?</div>
                    <div>
                        <p class="text-sm text-gray-500">分享者</p>
                        <p id="detail-sharer-name" class="font-bold text-gray-800">—</p>
                    </div>
                </div>
                <a id="msg-link" href="./message.html" class="flex items-center space-x-1 text-sm bg-white border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                    <span>發送私訊</span>
                </a>
            </div>

            <!-- 資訊格 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">📍 領取地點</p>
                    <p id="detail-location" class="font-semibold text-gray-800 text-sm">—</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">⏳ 剩餘時間</p>
                    <p id="detail-countdown" class="font-semibold text-orange-500 text-sm">計算中…</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">📦 數量/份量</p>
                    <p id="detail-quantity" class="font-semibold text-gray-800 text-sm">—</p>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 mb-1">⏳ 狀態</p>
                    <p id="detail-status-text" class="font-semibold text-receiver text-sm">—</p>
                </div>
            </div>

            <!-- 詳細說明 -->
            <div class="mb-8 border-t border-gray-100 pt-6">
                <h3 class="text-sm font-bold text-gray-900 mb-2">詳細說明：</h3>
                <p id="detail-description" class="text-gray-600 text-sm leading-relaxed">—</p>
            </div>

            <!-- 按鈕區（依身份動態顯示） -->
            <div id="action-area"></div>

        </div>
    </main>

    <script type="module">
        import { getCurrentUserSnapshot, loadUserProfile } from './user-store.js';

        const params  = new URLSearchParams(window.location.search);
        const foodId  = params.get('id');
        const snapshot = getCurrentUserSnapshot();
        const uid     = snapshot?.uid || null;

        if (!foodId) {
            document.getElementById('detail-title').textContent = '找不到食物資料';
            document.getElementById('action-area').innerHTML = '<p class="text-center text-gray-400">請從首頁選擇食物</p>';
        } else {
            loadDetail(foodId, uid);
        }

        async function loadDetail(id, uid) {
            try {
                const url = uid ? `/api/foods/${id}?uid=${uid}` : `/api/foods/${id}`;
                const res  = await fetch(url);
                if (!res.ok) throw new Error('找不到此食物');
                const food = await res.json();
                renderDetail(food);
            } catch (err) {
                document.getElementById('detail-title').textContent = err.message;
            }
        }

        const STATUS_COLOR = {
            available: 'bg-receiver text-white',
            reserved:  'bg-yellow-400 text-white',
            completed: 'bg-gray-400 text-white',
            expired:   'bg-gray-300 text-gray-600',
            waiting:   'bg-orange-400 text-white',
        };

        function renderDetail(food) {
            // 食物圖示
            const hero = document.getElementById('food-hero');
            if (food.image_path) {
                hero.innerHTML = `<img src="${food.image_path}" class="w-full h-full object-cover rounded-2xl">`;
            } else {
                hero.textContent = food.emoji;
                hero.className = hero.className.replace('bg-teal-50', 'bg-orange-50');
            }

            // 標籤與時間
            const statusBadge = document.getElementById('detail-status-badge');
            statusBadge.textContent = food.status_label;
            statusBadge.className = `text-xs font-bold px-3 py-1 rounded shadow-sm ${STATUS_COLOR[food.status] || 'bg-gray-300 text-white'}`;
            document.getElementById('detail-category-badge').textContent = food.category;
            document.getElementById('detail-time-ago').textContent = `發布於 ${food.time_ago}`;

            // 標題
            document.getElementById('detail-title').textContent = food.title;

            // 分享者
            const initials = (food.sharer_name || '?').slice(0, 2);
            document.getElementById('detail-sharer-avatar').textContent = initials;
            document.getElementById('detail-sharer-name').textContent = food.sharer_name || '—';

            // 私訊連結：帶入分享者 uid 和 food id
            const msgLink = document.getElementById('msg-link');
            if (msgLink) {
                if (food.is_my_post) {
                msgLink.classList.add('hidden'); // 自己的貼文不顯示私訊
                } else {
                    msgLink.href = `./message.html?with=${food.sharer_uid}&post=${food.id}`;
                    msgLink.addEventListener('click', (e) => {
                        if (!uid) {
                            e.preventDefault();
                            alert("請先登入才能使用私訊功能！");
                            window.location.href = '../index.html';
                        }
                    });
                }
            }

            // 資訊格
            document.getElementById('detail-location').textContent = food.pickup_location;
            const left = food.quantity_left ?? food.quantity;
            const qtyText = food.quantity
                ? `${left} / ${food.quantity} 份（剩餘 ${left} 份）`
                : '未填寫';
            document.getElementById('detail-quantity').textContent = qtyText;
            document.getElementById('detail-status-text').textContent = food.status_label;

            // 說明
            document.getElementById('detail-description').textContent = food.description || '（無說明）';

            // 倒數計時
            const countdownEl = document.getElementById('detail-countdown');
            if (food.expires_at_iso && countdownEl) {
                const expiresAt = new Date(food.expires_at_iso).getTime();
                function tick() {
                    const diff = expiresAt - Date.now();
                    if (diff <= 0) {
                        countdownEl.textContent = '⛔ 已過期';
                        countdownEl.classList.replace('text-orange-500', 'text-gray-400');
                        return;
                    }
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    const hStr = h > 0 ? `${h}:` : '';
                    countdownEl.textContent = `⏳ 還剩 ${hStr}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    setTimeout(tick, 1000);
                }
                tick();
            }

            // 按鈕區
            renderActions(food);
        }

        // 目前這筆食物資料（全域，供表單送出使用）
        let currentFood = null;

        function formatPickupOption(date) {
            const now = new Date();
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            const dayLabel = date.toDateString() === now.toDateString()
                ? '今天'
                : `${date.getMonth() + 1}/${date.getDate()}`;
            return `${dayLabel} ${hh}:${mm} 前`;
        }

        function buildPickupTimeOptions(food) {
            const quarterMs = 15 * 60 * 1000;
            const now = new Date();
            const expiresAt = food.expires_at_iso ? new Date(food.expires_at_iso) : null;
            if (!expiresAt || Number.isNaN(expiresAt.getTime())) {
                return '<option value="" disabled>目前沒有可預約的領取時間</option>';
            }

            const firstSlot = new Date(Math.ceil(now.getTime() / quarterMs) * quarterMs);
            const lastSlot = new Date(Math.floor(expiresAt.getTime() / quarterMs) * quarterMs);
            const options = [];

            for (let slot = firstSlot; slot <= lastSlot; slot = new Date(slot.getTime() + quarterMs)) {
                const label = formatPickupOption(slot);
                options.push(`<option value="${label}">${label}</option>`);
            }

            return options.length > 0
                ? options.join('')
                : '<option value="" disabled>目前沒有可預約的領取時間</option>';
        }

        function renderActions(food) {
            currentFood = food;
            const area = document.getElementById('action-area');

            // 情況 1：這是自己發布的食物 → 顯示訂單管理
            if (food.is_my_post) {
                area.innerHTML = `
                    <div class="py-5 bg-orange-50 rounded-xl border border-orange-100 px-5 space-y-4">
                        <p class="text-sm font-semibold text-giver">🎁 這是你發布的食物（狀態：${food.status_label}）</p>
                        <div id="orders-panel" class="space-y-3"></div>
                    </div>`;
                loadOrders(food.id);
                return;
            }

            // 情況 2：使用者已有待處理的預約或候補
            if (food.my_reservation_status === 'pending' || food.my_reservation_status === 'waiting') {
                const isWaiting = food.my_reservation_status === 'waiting';
                const expiresAt = food.expires_at_iso ? new Date(food.expires_at_iso) : null;
                const minsLeft  = expiresAt ? (expiresAt - Date.now()) / 60000 : 999;
                const canCancel = isWaiting || minsLeft > 10;

                area.innerHTML = `
                    <div class="${isWaiting ? 'bg-orange-50 border-orange-100 text-orange-700' : 'bg-teal-50 border-teal-100 text-teal-700'} border rounded-xl p-4 mb-3 text-sm">
                        ${isWaiting 
                            ? `⏳ 你已在候補名單中（目前候補順位：<b>${food.waiting_position || 1}</b>）。` 
                            : '✅ 你已預約此食物，請準時領取。'}
                        ${(!canCancel && !isWaiting) ? '<br><span class="text-red-500 text-xs">距過期不足 10 分鐘，無法取消</span>' : ''}
                    </div>
                    ${canCancel ? `
                    <button id="btn-cancel" class="w-full bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-600 font-bold py-3 px-4 rounded-xl transition">
                        ${isWaiting ? '取消候補' : '取消預約'}
                    </button>
                    ${!isWaiting ? '<p class="text-center text-xs text-gray-400 mt-2">距過期 10 分鐘內將無法取消</p>' : ''}` : ''}`;

                if (canCancel) {
                    document.getElementById('btn-cancel').addEventListener('click', () => cancelReservation(food));
                }
                return;
            }

            // 情況 3：食物可領取或可候補，使用者還沒預約
            if (food.status === 'available' || food.status === 'reserved') {
                const isReserved = food.status === 'reserved';
                if (!uid) {
                    area.innerHTML = `
                        <button onclick="window.location.href='../index.html'"
                            class="w-full bg-receiver hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition">
                            登入後才能${isReserved ? '候補' : '預約'}
                        </button>`;
                    return;
                }

                const maxQty = food.quantity_left ?? food.quantity ?? 1;
                const pickupTimeOptions = buildPickupTimeOptions(food);
                area.innerHTML = `
                    <div class="space-y-4 border border-gray-100 bg-gray-50 rounded-xl p-5">
                        <h3 class="font-bold text-gray-800 text-sm">${isReserved ? '填寫候補資訊' : '填寫預約資訊'}</h3>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">姓名 <span class="text-red-500">*</span></label>
                                <input id="f-name" type="text" placeholder="真實姓名"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-receiver outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">學號 <span class="text-red-500">*</span></label>
                                <input id="f-sid" type="text" placeholder=" "
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-receiver outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">預計領取時間 <span class="text-red-500">*</span></label>
                                ${isReserved 
                                    ? `<input id="f-time" type="text" value="系統自動候補" readonly disabled
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-100 text-gray-500 cursor-not-allowed outline-none">`
                                    : `<select id="f-time"
                                    class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-receiver outline-none">
                                    <option value="">請選擇領取時間</option>
                                    ${pickupTimeOptions}
                                       </select>`
                                }
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">預約份數 <span class="text-red-500">*</span></label>
                                <input id="f-qty" type="number" min="1" max="${isReserved ? (food.quantity || 1) : maxQty}" value="1"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-receiver outline-none text-center">
                            </div>
                        </div>

                        <div class="flex gap-3 pt-2">
                            <button id="btn-reserve"
                                class="flex-1 ${isReserved ? 'bg-orange-400 hover:bg-orange-500' : 'bg-receiver hover:bg-teal-600'} text-white font-bold py-3 rounded-xl shadow-sm transition">
                                ${isReserved ? '⏳ 排隊候補' : '直接預約'}
                            </button>
                        </div>
                    </div>`;

                document.getElementById('btn-reserve').addEventListener('click', () => submitReservation(food, false));
                return;
            }

            // 情況 4：已全部領完或過期
            const msgMap = {
                completed: '此食物已全部領完',
                expired:   '此食物已過期下架',
            };
            area.innerHTML = `
                <div class="text-center py-4 bg-gray-50 rounded-xl border border-gray-200">
                    <p class="text-sm text-gray-500">${msgMap[food.status] || '此食物目前不可領取'}</p>
                </div>`;
        }

        // 驗證並取得表單值
        function getFormValues() {
            const name = document.getElementById('f-name')?.value.trim();
            const sid  = document.getElementById('f-sid')?.value.trim();
            const time = document.getElementById('f-time')?.value.trim();
            const qty  = parseInt(document.getElementById('f-qty')?.value) || 1;
            if (!name || !sid || !time) { alert('請填寫姓名、學號與預計領取時間'); return null; }
            return { name, sid, time, qty };
        }

        // 直接預約
        async function submitReservation(food, fromCart = false) {
            const vals = getFormValues();
            if (!vals) return;

            const btn = document.getElementById('btn-reserve');
            if (btn) { btn.disabled = true; btn.textContent = '預約中…'; }

            const data = new FormData();
            data.append('requester_uid',         uid);
            data.append('quantity_reserved',     vals.qty);
            data.append('requester_name',        vals.name);
            data.append('student_id',            vals.sid);
            data.append('estimated_pickup_time', vals.time);

            try {
                const res  = await fetch(`/api/foods/${food.id}/reserve`, { method: 'POST', body: data });
                const json = await res.json();
                if (!res.ok) throw new Error(json.detail || '預約失敗');
                if (json.waiting) {
                    alert('已排入候補名單！如果有預約者取消，系統將自動依序為您遞補。', () => {
                        window.location.reload();
                    });
                } else {
                    alert(`預約成功！剩餘 ${json.quantity_left} 份`, () => {
                        window.location.reload();
                    });
                }
            } catch (err) {
                alert(`預約失敗：${err.message}`);
                if (btn) { btn.disabled = false; btn.textContent = food.status === 'reserved' ? '⏳ 排隊候補' : '🙋 直接預約'; }
            }
        }

        // 取消預約
        function cancelReservation(food) {
            confirm('確定要取消預約嗎？', async () => {
                // 先撈 reservation_id
                const res2   = await fetch(`/api/users/${uid}/requests`);
                const items  = await res2.json();
                const mine   = items.find(i => i.id == food.id || i.food_id == food.id);
                const resId  = mine?.reservation_id;
                if (!resId) { alert('找不到預約資料'); return; }

                const data = new FormData();
                data.append('requester_uid',  uid);
                data.append('reservation_id', resId);

                const res = await fetch(`/api/foods/${food.id}/cancel`, { method: 'POST', body: data });
                const json = await res.json();
                if (!res.ok) { alert(json.detail || '取消失敗'); return; }
                alert('預約已取消', () => {
                    window.location.reload();
                });
            });
        }

        // 分享者查看訂單
        async function loadOrders(foodId) {
            const panel = document.getElementById('orders-panel');
            if (!panel) return;
            panel.innerHTML = '<p class="text-xs text-gray-400">載入中…</p>';
            try {
                const res   = await fetch(`/api/foods/${foodId}/reservations?sharer_uid=${uid}`);
                const orders = await res.json();
                if (orders.length === 0) { panel.innerHTML = '<p class="text-xs text-gray-400">目前無預約訂單</p>'; return; }
                panel.innerHTML = orders.map(o => `
                    <div class="border border-orange-100/60 rounded-xl p-4 bg-white text-sm shadow-sm hover:shadow transition duration-150">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-gray-800">${o.requester_name} <span class="text-xs text-gray-400">${o.student_id}</span></span>
                            <span class="text-xs px-2 py-0.5 rounded-full ${
                                o.status === 'completed' ? 'bg-teal-100 text-teal-600' : 
                                o.status === 'no_show' ? 'bg-red-100 text-red-500' : 
                                o.status === 'waiting' ? 'bg-orange-100 text-orange-600' :
                                'bg-orange-50 text-giver'
                            }">${
                                o.status === 'pending' ? '待領取' : 
                                o.status === 'completed' ? '已完成' : 
                                o.status === 'no_show' ? '未取' : 
                                o.status === 'waiting' ? '候補中' : '未知'
                            }</span>
                        </div>
                        <p class="text-gray-500 text-xs">份數：${o.quantity_reserved}　預計：${o.estimated_pickup_time}</p>
                        ${o.status === 'pending' ? `
                        <div class="flex gap-2 mt-3">
                            <button onclick="confirmComplete(${foodId}, ${o.reservation_id})" class="flex-1 text-xs py-1.5 rounded-lg bg-receiver text-white hover:bg-teal-600 transition">✅ 確認完成</button>
                            <button onclick="confirmNoShow(${foodId}, ${o.reservation_id})" class="flex-1 text-xs py-1.5 rounded-lg bg-white border border-red-200 text-red-500 hover:bg-red-50 transition">❌ 取消預約</button>
                        </div>` : ''}
                    </div>`).join('');
            } catch { panel.innerHTML = '<p class="text-xs text-red-400">載入失敗</p>'; }
        }

        window.confirmComplete = async (foodId, resId) => {
            const data = new FormData();
            data.append('sharer_uid', uid);
            data.append('reservation_id', resId);
            const res = await fetch(`/api/foods/${foodId}/complete`, { method: 'POST', body: data });
            const json = await res.json();
            if (!res.ok) { alert(json.detail); return; }
            alert('已確認完成！');
            loadOrders(foodId);
        };

        window.confirmNoShow = async (foodId, resId) => {
            confirm('確定標記為「未取」？此操作會計入對方的取貨率', async () => {
                const data = new FormData();
                data.append('sharer_uid', uid);
                data.append('reservation_id', resId);
                const res = await fetch(`/api/foods/${foodId}/no_show`, { method: 'POST', body: data });
                const json = await res.json();
                if (!res.ok) { alert(json.detail); return; }
                alert('已標記未取');
                loadOrders(foodId);
            });
        };
    </script>
</body>
</html>
